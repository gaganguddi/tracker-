</div>
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface font-medium">Recurring Monthly Expense</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Auto-logs on the 24th of each month</span>
</div>
</div>
<!-- Tactile Switch Control -->
<button aria-checked="false" class="w-12 h-7 rounded-full bg-surface-container-highest p-1 transition-colors relative flex items-center" id="recurringToggle" role="switch" type="button">
<span class="w-5 h-5 rounded-full bg-on-surface transition-transform duration-200 ease-out transform translate-x-0 shadow-md" id="toggleKnob"></span>
</button>
</div>
</section>
<!-- Bottom Floating Primary CTA Button -->
<div class="sticky bottom-4 z-20 w-full pt-2">
<button class="w-full py-4 rounded-xl bg-primary text-on-primary font-headline-sm text-headline-sm flex items-center justify-center gap-2 shadow-[0_8px_28px_rgba(78,222,163,0.32)] active:scale-[0.98] transition-all hover:opacity-95" id="mainSaveCta" type="button">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span id="ctaLabel">Save Expense ($48.50)</span>
</button>
</div>
</div>
<script>
  (function () {
    let currentAmount = "48.50";
    let activeCurrency = "$";

    const displayEl = document.getElementById("amountDisplay");
    const currencyEl = document.getElementById("currencySymbol");
    const ctaLabelEl = document.getElementById("ctaLabel");
    const keypad = document.getElementById("thumbKeypad");
    const categoryGrid = document.getElementById("categoryGrid");
    const recurringToggle = document.getElementById("recurringToggle");
    const toggleKnob = document.getElementById("toggleKnob");
    let isRecurring = false;

    function updateDisplays() {
      displayEl.textContent = currentAmount;
      ctaLabelEl.textContent = `Save Expense (${activeCurrency}${currentAmount})`;
    }

    // Number Pad Handling
    keypad.addEventListener("click", (e) => {
      const btn = e.target.closest(".keypad-btn");
      if (!btn) return;
      const key = btn.getAttribute("data-key");

      if (key === "backspace") {
        if (currentAmount.length <= 1) {
          currentAmount = "0";
        } else {
          currentAmount = currentAmount.slice(0, -1);
        }
      } else if (key === ".") {
        if (!currentAmount.includes(".")) {
          currentAmount += ".";
        }
      } else {
        if (currentAmount === "0") {
          currentAmount = key;
        } else {
          const parts = currentAmount.split(".");
          if (parts[1] && parts[1].length >= 2) {
            // Already 2 decimal points, stop adding
            return;
          }
          if (currentAmount.length < 9) {
            currentAmount += key;
          }
        }
      }
      updateDisplays();
    });

    // Preset buttons
    document.querySelectorAll(".preset-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const val = parseFloat(btn.getAttribute("data-val"));
        let num = parseFloat(currentAmount) || 0;
        num = (num + val).toFixed(2);
        currentAmount = num;
        updateDisplays();
      });
    });

    // Round up button
    document.getElementById("roundUpBtn").addEventListener("click", () => {
      let num = parseFloat(currentAmount) || 0;
      let nextWhole = Math.ceil(num);
      if (nextWhole === num) nextWhole += 1;
      currentAmount = nextWhole.toFixed(2);
      updateDisplays();
    });

    // Currency Switcher
    document.querySelectorAll(".currency-toggle-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".currency-toggle-btn").forEach((b) => {
          b.classList.remove("bg-primary", "text-on-primary");
          b.classList.add("text-on-surface-variant");
        });
        btn.classList.add("bg-primary", "text-on-primary");
        btn.classList.remove("text-on-surface-variant");

        activeCurrency = btn.getAttribute("data-symbol");
        currencyEl.textContent = activeCurrency;
        updateDisplays();
      });
    });

    // Category Selector
    categoryGrid.addEventListener("click", (e) => {
      const chip = e.target.closest(".category-chip");
      if (!chip) return;
      document.querySelectorAll(".category-chip").forEach((c) => {
        c.className =
          "category-chip flex flex-col items-center justify-center p-2.5 rounded-xl bg-surface-container text-on-surface hover:bg-surface-container-high transition-all active:scale-95 shadow-sm";
        const icon = c.querySelector(".material-symbols-outlined");
        if (icon) {
          icon.style.fontVariationSettings = "'FILL' 0";
          icon.classList.remove("text-on-primary");
          icon.classList.add("text-on-surface-variant");
        }
      });

      chip.className =
        "category-chip flex flex-col items-center justify-center p-2.5 rounded-xl bg-primary text-on-primary transition-all active:scale-95 shadow-md";
      const activeIcon = chip.querySelector(".material-symbols-outlined");
      if (activeIcon) {
        activeIcon.style.fontVariationSettings = "'FILL' 1";
        activeIcon.classList.remove("text-on-surface-variant");
        activeIcon.classList.add("text-on-primary");
      }
    });

    // Recurring toggle switch
    recurringToggle.addEventListener("click", () => {
      isRecurring = !isRecurring;
      recurringToggle.setAttribute("aria-checked", isRecurring.toString());
      if (isRecurring) {
        recurringToggle.classList.remove("bg-surface-container-highest");
        recurringToggle.classList.add("bg-secondary-container");
        toggleKnob.classList.add("translate-x-5");
        toggleKnob.classList.remove("translate-x-0");
        toggleKnob.classList.add("bg-on-secondary-container");
      } else {
        recurringToggle.classList.add("bg-surface-container-highest");
        recurringToggle.classList.remove("bg-secondary-container");
        toggleKnob.classList.remove("translate-x-5");
        toggleKnob.classList.add("translate-x-0");
        toggleKnob.classList.remove("bg-on-secondary-container");
      }
    });

    // Payment method selector
    document.querySelectorAll(".payment-pill").forEach((pill) => {
      pill.addEventListener("click", () => {
        document.querySelectorAll(".payment-pill").forEach((p) => {
          p.classList.remove("bg-primary-container", "text-on-primary");
          p.classList.add("bg-surface-container-high", "text-on-surface-variant");
        });
        pill.classList.add("bg-primary-container", "text-on-primary");
        pill.classList.remove("bg-surface-container-high", "text-on-surface-variant");
      });
    });

    // Save triggers with subtle feedback
    function triggerSave() {
      const btn = document.getElementById("mainSaveCta");
      btn.innerHTML = `<span class="material-symbols-outlined text-[24px] animate-spin">progress_activity</span><span>Logged!</span>`;
      setTimeout(() => {
        history.back();
      }, 450);
    }

    document.getElementById("mainSaveCta").addEventListener("click", triggerSave);
    document.getElementById("headerSaveBtn").addEventListener("click", triggerSave);
  })();
</script></main></body></html>
